<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horizont · Vamos brindar 2027</title>
<link rel="modulepreload" href="./lib/mindar-image-three.prod.js">
<link rel="modulepreload" href="./lib/controller-mGt1s8dJ.js">
<link rel="modulepreload" href="./three/three.module.js">
<link rel="preload" href="./card.mind" as="fetch" crossorigin>
<link rel="preload" href="./avatar.png" as="image">
<style>
  html,body{margin:0;height:100%;background:#0e0e10;color:#f0d496;font-family:Georgia,"Times New Roman",serif;overflow:hidden}
  #ar{position:fixed;inset:0;overflow:hidden}
  .tela{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;box-sizing:border-box;z-index:20}
  .fundo{background:radial-gradient(circle at 50% 35%,#2a2418 0%,#0e0e10 65%)}
  h1{font-weight:normal;letter-spacing:.18em;font-size:30px;margin:0 0 6px}
  .sub{letter-spacing:.35em;font-size:11px;color:#c9a45c;margin-bottom:34px}
  .ola{font-size:22px;margin-bottom:10px}
  p{color:#d8c49a;font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.5;max-width:320px;margin:0 0 26px}
  button{font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;border:1px solid #c9a45c;background:#c9a45c;color:#0e0e10;padding:14px 28px;border-radius:999px;font-weight:600;min-width:240px;margin:6px}
  button:disabled{opacity:.55}
  button.sec{background:transparent;color:#f0d496}
  #dica{position:fixed;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom));text-align:center;z-index:15;font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;color:#fff;text-shadow:0 1px 4px #000;display:none;padding:0 20px}
  #mira{position:fixed;left:50%;top:50%;width:78vw;max-width:420px;aspect-ratio:1.75;transform:translate(-50%,-50%);border:2px dashed rgba(240,212,150,.8);border-radius:14px;z-index:14;display:none}
  #rec{position:fixed;top:calc(18px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:16;background:rgba(0,0,0,.55);color:#fff;font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;padding:8px 14px;border-radius:999px;display:none}
  #rec i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#e24b4a;margin-right:8px;vertical-align:middle;animation:pisca 1s infinite}
  @keyframes pisca{50%{opacity:.2}}
  #final video{width:min(78vw,360px);max-height:58vh;border-radius:14px;border:1px solid #c9a45c;margin-bottom:18px;background:#000}
  .oculto{display:none!important}
  .erro{color:#f09595}
</style>
<script type="importmap">
{"imports":{"three":"./three/three.module.js","three/addons/":"./three/addons/"}}
</script>
</head>
<body>
<div id="ar"></div>
<div id="mira"></div>
<div id="dica">Aponte a câmera para o cartão</div>
<div id="rec"><i></i>Gravando</div>

<div id="inicio" class="tela fundo">
  <h1>HORIZONT</h1>
  <div class="sub">INVESTIMENTOS</div>
  <div class="ola" id="ola">Olá!</div>
  <p>Pegue o seu cartão, toque em começar e aponte a câmera para ele.</p>
  <button id="btnComecar" disabled>Preparando…</button>
  <p id="erro" class="erro oculto" style="margin-top:18px"></p>
</div>

<div id="final" class="tela fundo oculto">
  <video id="preview" playsinline loop muted autoplay></video>
  <button id="btnShare">Compartilhar no Stories</button>
  <button id="btnDenovo" class="sec">Gravar de novo</button>
  <p id="dicaShare" class="oculto" style="margin-top:14px"></p>
</div>

<script type="module">
const DURACAO = 8000;
const TACA = { u: .82, v: .15 };
const params = new URLSearchParams(location.search);
const nome = (params.get('n') || '').trim().slice(0, 40);
const $ = id => document.getElementById(id);
$('ola').textContent = nome ? `Olá, ${nome}!` : 'Olá!';

let THREE, MindARThree, alvoURL, avatarTex;
let mindar, renderer, scene, camera, anchor, raiz;
let efeito = null, inicioEfeito = 0, gravando = false, gravador = null, pedacos = [], arquivo = null, comp, ctx, timerDica;

const carregando = (async () => {
  const [t, m, buf] = await Promise.all([
    import('three'),
    import('./lib/mindar-image-three.prod.js'),
    fetch('./card.mind').then(r => r.arrayBuffer())
  ]);
  THREE = t; MindARThree = m.MindARThree;
  alvoURL = URL.createObjectURL(new Blob([buf]));
  avatarTex = await new THREE.TextureLoader().loadAsync('./avatar.png');
  avatarTex.colorSpace = THREE.SRGBColorSpace;
})();
carregando.then(() => { $('btnComecar').disabled = false; $('btnComecar').textContent = 'Começar'; })
  .catch(() => { $('btnComecar').textContent = 'Erro ao carregar'; });

function texturaTexto(linhas, w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const l of linhas) {
    g.font = l.font;
    const grad = g.createLinearGradient(0, l.y - 60, 0, l.y + 60);
    grad.addColorStop(0, '#fff3cf'); grad.addColorStop(.5, '#e2be78'); grad.addColorStop(1, '#a8823f');
    g.shadowColor = 'rgba(0,0,0,.85)'; g.shadowBlur = 18; g.fillStyle = grad; g.fillText(l.t, w / 2, l.y);
    g.shadowColor = 'rgba(255,200,110,.8)'; g.shadowBlur = 24; g.fillText(l.t, w / 2, l.y);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function texturaBrilho() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.3, 'rgba(255,255,255,.7)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
}

function criarFogos(grupo, brilho) {
  const cores = [0xffd98a, 0xffffff, 0xff6b5a, 0xffc04d, 0x9fe1cb];
  const disparos = [];
  for (let k = 0; k < 7; k++) {
    const N = 140, pos = new Float32Array(N * 3), vel = [];
    for (let i = 0; i < N; i++) {
      const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1), sp = .22 + Math.random() * .08;
      vel.push([Math.sin(ph) * Math.cos(th) * sp, Math.sin(ph) * Math.sin(th) * sp, Math.cos(ph) * sp * .3]);
    }
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ size: .075, map: brilho, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: cores[k % cores.length], opacity: 0 });
    const pts = new THREE.Points(geo, mat); grupo.add(pts);
    disparos.push({ pts, pos, vel, t0: 1.6 + k * .85 + Math.random() * .3, c: [(Math.random() - .5) * 1.1, .55 + Math.random() * .45, -.05] });
  }
  return disparos;
}

function montarEfeito(grupo) {
  const brilho = texturaBrilho();
  const N = 260, pos = new Float32Array(N * 3), vel = [];
  for (let i = 0; i < N; i++) vel.push([(Math.random() - .5) * .5, (Math.random() - .2) * .5, .3 + Math.random() * .6]);
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const faiscas = new THREE.Points(geo, new THREE.PointsMaterial({ size: .045, map: brilho, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xffd98a }));
  grupo.add(faiscas);

  const anel = new THREE.Mesh(new THREE.RingGeometry(.48, .5, 96), new THREE.MeshBasicMaterial({ color: 0xf0d496, transparent: true, blending: THREE.AdditiveBlending, side: THREE.DoubleSide }));
  anel.position.z = .005; grupo.add(anel);

  const fogos = criarFogos(grupo, brilho);

  const asp = avatarTex.image.width / avatarTex.image.height, AH = .78, AW = AH * asp;
  const avatarPivo = new THREE.Group(); grupo.add(avatarPivo);
  const avatar = new THREE.Mesh(new THREE.PlaneGeometry(AW, AH), new THREE.MeshBasicMaterial({ map: avatarTex, transparent: true, depthWrite: false }));
  avatar.position.y = AH / 2; avatarPivo.add(avatar);

  const tinim = new THREE.Sprite(new THREE.SpriteMaterial({ map: brilho, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0, color: 0xfff1c9 }));
  tinim.position.set((TACA.u - .5) * AW, (1 - TACA.v) * AH, .01); avatarPivo.add(tinim);

  const msg = nome ? `Vamos brindar 2027, ${nome}!` : 'Vamos brindar 2027!';
  const tam = msg.length > 26 ? 64 : 80;
  const texto = new THREE.Mesh(new THREE.PlaneGeometry(1.3, .18),
    new THREE.MeshBasicMaterial({ map: texturaTexto([{ t: msg, font: `italic bold ${tam}px Georgia, serif`, y: 72 }], 1200, 150), transparent: true, depthWrite: false, opacity: 0 }));
  grupo.add(texto);

  return { faiscas, pos, vel, anel, fogos, avatarPivo, tinim, texto, AH };
}

function atualizarEfeito(t) {
  const e = efeito; if (!e) return;
  for (let i = 0; i < e.vel.length; i++) {
    const v = e.vel[i], tt = Math.max(0, t - (i % 40) * .015);
    e.pos[i*3] = v[0] * tt; e.pos[i*3+1] = v[1] * tt; e.pos[i*3+2] = Math.max(0, v[2] * tt - .25 * tt * tt);
  }
  e.faiscas.geometry.attributes.position.needsUpdate = true;
  e.faiscas.material.opacity = Math.max(0, 1 - t / 2.2);

  const a = Math.min(1, t / 1.1); e.anel.scale.setScalar(.2 + a * 1.6); e.anel.material.opacity = 1 - a;

  const s = THREE.MathUtils.smoothstep(t, .3, 1.8);
  e.avatarPivo.position.set(-.05, -.12 + .32 * s, .05 + .1 * s);
  e.avatarPivo.scale.setScalar(.25 + .75 * s);
  e.avatarPivo.rotation.x = (1 - s) * -1.1;
  const brinde = THREE.MathUtils.smoothstep(t, 2.2, 2.6) - THREE.MathUtils.smoothstep(t, 2.9, 3.3);
  e.avatarPivo.rotation.z = -.12 * brinde + Math.sin(t * 2.2) * .025 * s;
  const pisca = Math.max(0, 1 - Math.abs(t - 2.75) / .35);
  e.tinim.material.opacity = pisca; e.tinim.scale.setScalar(.05 + .3 * pisca);

  for (const f of e.fogos) {
    const tt = t - f.t0;
    if (tt < 0 || tt > 1.6) { f.pts.material.opacity = 0; continue; }
    for (let i = 0; i < f.vel.length; i++) {
      const v = f.vel[i];
      f.pos[i*3] = f.c[0] + v[0] * tt; f.pos[i*3+1] = f.c[1] + v[1] * tt - .12 * tt * tt; f.pos[i*3+2] = f.c[2] + v[2] * tt;
    }
    f.pts.geometry.attributes.position.needsUpdate = true;
    f.pts.material.opacity = tt < .1 ? tt * 10 : Math.max(0, 1 - (tt - .4) / 1.2);
  }

  const m = THREE.MathUtils.smoothstep(t, 2.2, 3.0);
  e.texto.material.opacity = m;
  e.texto.position.set(0, -.4 + .012 * Math.sin(t * 2), .1);
  e.texto.scale.setScalar(.6 + .2 * m);
}

function prepararComposicao() {
  const box = $('ar').getBoundingClientRect();
  const k = Math.min(Math.min(2, window.devicePixelRatio || 1), 1280 / Math.max(box.width, box.height));
  comp = document.createElement('canvas');
  comp.width = Math.round(box.width * k / 2) * 2; comp.height = Math.round(box.height * k / 2) * 2;
  ctx = comp.getContext('2d');
}
function desenharComposicao() {
  const box = $('ar').getBoundingClientRect(), k = comp.width / box.width;
  const v = mindar.video, vr = v.getBoundingClientRect(), cr = renderer.domElement.getBoundingClientRect();
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, comp.width, comp.height);
  ctx.drawImage(v, (vr.left - box.left) * k, (vr.top - box.top) * k, vr.width * k, vr.height * k);
  ctx.drawImage(renderer.domElement, (cr.left - box.left) * k, (cr.top - box.top) * k, cr.width * k, cr.height * k);
}
function tipoVideo() {
  const op = ['video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  return op.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
}
function iniciarGravacao() {
  prepararComposicao();
  const stream = comp.captureStream(30), tipo = tipoVideo();
  try { gravador = new MediaRecorder(stream, tipo ? { mimeType: tipo, videoBitsPerSecond: 6e6 } : undefined); }
  catch (e) { gravador = new MediaRecorder(stream); }
  pedacos = [];
  gravador.ondataavailable = ev => ev.data.size && pedacos.push(ev.data);
  gravador.onstop = finalizar;
  gravador.start(250); gravando = true;
  $('rec').style.display = 'block'; $('dica').style.display = 'none'; $('mira').style.display = 'none';
  setTimeout(() => { gravando = false; gravador.state !== 'inactive' && gravador.stop(); }, DURACAO);
}
function finalizar() {
  $('rec').style.display = 'none';
  const tipo = (gravador.mimeType || 'video/mp4').split(';')[0], ext = tipo.includes('mp4') ? 'mp4' : 'webm';
  const blob = new Blob(pedacos, { type: tipo });
  arquivo = new File([blob], `horizont-2027.${ext}`, { type: tipo });
  $('preview').src = URL.createObjectURL(blob);
  $('final').classList.remove('oculto');
  mindar.stop(); renderer.setAnimationLoop(null);
}
async function compartilhar() {
  if (arquivo && navigator.canShare && navigator.canShare({ files: [arquivo] })) {
    try { await navigator.share({ files: [arquivo] }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = $('preview').src; a.download = arquivo.name; a.click();
  const d = $('dicaShare'); d.classList.remove('oculto');
  d.textContent = 'O vídeo foi salvo. Abra o Instagram, crie um Stories e escolha o vídeo na galeria.';
}

async function comecar() {
  $('btnComecar').disabled = true; $('btnComecar').textContent = 'Abrindo a câmera…';
  try {
    await carregando;
    mindar = new MindARThree({ container: $('ar'), imageTargetSrc: alvoURL, uiLoading: 'no', uiScanning: 'no', uiError: 'no', filterMinCF: .0001, filterBeta: .001 });
    ({ renderer, scene, camera } = mindar);
    anchor = mindar.addAnchor(0);
    raiz = new THREE.Group(); anchor.group.add(raiz);
    const ultima = new THREE.Matrix4();
    anchor.onTargetUpdate = () => { if (anchor.visible) ultima.copy(anchor.group.matrix); };
    anchor.onTargetFound = () => {
      if (!efeito) { efeito = montarEfeito(raiz); inicioEfeito = performance.now(); clearTimeout(timerDica); iniciarGravacao(); }
    };
    await mindar.start();
    $('inicio').classList.add('oculto');
    $('dica').style.display = 'block'; $('mira').style.display = 'block';
    timerDica = setTimeout(() => { $('dica').textContent = 'Chegue mais perto e deixe o cartão inteiro na tela, com boa luz'; }, 9000);
    renderer.setAnimationLoop(() => {
      if (efeito) { if (!anchor.visible) { anchor.group.matrix.copy(ultima); anchor.group.visible = true; } atualizarEfeito((performance.now() - inicioEfeito) / 1000); }
      renderer.render(scene, camera);
      if (gravando) desenharComposicao();
    });
  } catch (e) {
    console.error(e);
    $('btnComecar').disabled = false; $('btnComecar').textContent = 'Tentar de novo';
    const er = $('erro'); er.classList.remove('oculto');
    er.textContent = 'Não consegui abrir a câmera. Permita o acesso à câmera e abra este link pelo Safari (iPhone) ou Chrome (Android).';
  }
}
$('btnComecar').onclick = comecar;
$('btnShare').onclick = compartilhar;
$('btnDenovo').onclick = () => location.reload();
</script>
</body>
</html>
